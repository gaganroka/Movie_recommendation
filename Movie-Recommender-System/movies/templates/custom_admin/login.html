{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen" style="background-color: #0F0F23; color: white;">

  <!-- Login Box -->
  <div class="relative px-8 py-10 rounded-2xl shadow-2xl w-full max-w-sm" style="background-color: #1B1B30; border: 1px solid rgba(255,255,255,0.06);">

    <!-- Messages -->
    {% if messages %}
    <div class="mb-3">
      {% for message in messages %}
      <div class="text-sm p-2 rounded {% if message.tags == 'success' %}bg-green-900/30 text-green-300 border border-green-700{% elif message.tags == 'error' %}bg-red-900/30 text-red-300 border border-red-700{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="" class="space-y-5">
      {% csrf_token %}

      <!-- Logo -->
      <div class="flex flex-col items-center gap-3 mb-2">
        <a href="/" aria-label="Movie Recommender home" class="focus:outline-none focus-visible:ring-2 focus-visible:ring-[#CA8A04] rounded-full">
          <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 12px rgba(202,138,4,0.6));">
            <circle cx="50" cy="50" r="42" stroke="#CA8A04" stroke-width="2.5" fill="none" opacity="0.95"/>
            <circle cx="50" cy="50" r="42" stroke="#CA8A04" stroke-width="0.8" fill="none" opacity="0.3"/>
            <circle cx="50" cy="50" r="22" stroke="#CA8A04" stroke-width="3" fill="none" opacity="0.95"/>
            <circle cx="50" cy="50" r="14" stroke="#CA8A04" stroke-width="2.5" fill="none" opacity="0.9"/>
            <circle cx="50" cy="50" r="6" fill="#FDE68A" opacity="1"/>
            <circle cx="50" cy="50" r="22" stroke="#FDE68A" stroke-width="3.5" stroke-dasharray="50 35" stroke-linecap="round" fill="none" opacity="1">
              <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.2s" repeatCount="indefinite"/>
            </circle>
            <g transform="translate(74, 10)">
              <circle cx="0" cy="0" r="11" fill="#CA8A04" opacity="0.95"/>
              <polygon points="-3.5,-5 6,0 -3.5,5" fill="#0F0F23"/>
            </g>
          </svg>
        </a>
        <a href="/" class="text-base font-bold text-white tracking-tight hover:text-[#FDE68A] transition-colors">Movie Recommender</a>
      </div>

      <h2 class="text-center font-semibold text-xl text-white mb-4">Admin Login</h2>

      <!-- Email -->
      <div>
        <label class="block text-sm mb-1 text-gray-300">Email</label>
        <input type="text" name="username" required placeholder="Email or Username"
          class="w-full px-4 py-2 border border-gray-600 rounded-md bg-black bg-opacity-40 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#CA8A04] transition">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm mb-1 text-gray-300 lowercase">password</label>
        <input type="password" name="password" required placeholder="Password"
          class="w-full px-4 py-2 border border-gray-600 rounded-md bg-black bg-opacity-40 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#CA8A04] transition">
      </div>

      <!-- Login Button -->
      <button type="submit"
        class="w-full py-2 rounded-full bg-[#CA8A04] text-black font-semibold hover:opacity-90 transition mt-2">
        Login
      </button>
    </form>
  </div>

</body>
</html>
