<head>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Navbar -->
<nav class="bg-[#121212] bg-opacity-50 backdrop-blur-lg p-4 sticky top-0 z-40 font-['Inter'] text-white">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Logo -->
        
<!-- Animated Logo -->

<div class="flex items-center gap-2.5" aria-label="Movie Recommender">
  <a href="/" aria-label="Movie Recommender home" class="focus:outline-none focus-visible:ring-2 focus-visible:ring-[#CA8A04] rounded-full relative inline-block">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 12px rgba(202,138,4,0.6));">
      <!-- Outer ring -->
      <circle cx="50" cy="50" r="42" stroke="#A07002" stroke-width="2" fill="none" opacity="0.9"/>
      <!-- Inner target circle -->
      <circle cx="50" cy="50" r="22" stroke="#CA8A04" stroke-width="3" fill="none" opacity="0.95"/>
      <circle cx="50" cy="50" r="14" stroke="#CA8A04" stroke-width="2" fill="none" opacity="0.9"/>
      <circle cx="50" cy="50" r="6" fill="#FDE68A" opacity="1"/>
      <!-- Spinning bright arc (inside circle, moves around) -->
      <circle cx="50" cy="50" r="22" stroke="#FDE68A" stroke-width="3" stroke-dasharray="45 30" stroke-linecap="round" fill="none" opacity="1">
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Small play button top-right -->
      <g transform="translate(72, 12)">
        <circle cx="0" cy="0" r="10" fill="#CA8A04" opacity="0.95"/>
        <polygon points="-3,-4 5,0 -3,4" fill="#0F0F23"/>
      </g>
    </svg>
  </a>
  <a href="/" class="text-lg font-bold text-white tracking-tight hover:text-[#FDE68A] transition-colors">Movie Recommender System</a>
</div>


        <!-- Search Bar -->
        <div class="relative w-96 mx-4">
            <input type="text" id="search-input" name="q" value="{{ query }}" placeholder="Quick search"
                class="w-full px-4 py-2 pl-10 rounded-full bg-transparent border border-gray-500 text-gray-400 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-400 transition duration-300">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <div id="search-results"
                class="absolute w-full bg-gray-900 text-white rounded-lg mt-1 hidden overflow-hidden shadow-lg"></div>
        </div>

        <!-- Navigation Links -->
        <div class="flex items-center space-x-6 text-gray-500 font-medium">

            <!-- User Authentication -->
            {% if request.session.admin_logged_in %}
            <!-- Admin Session -->
            <div class="flex items-center space-x-4">
                <span class="text-red-400 font-bold">Admin</span>
                <a href="{% url 'admin_dashboard' %}" class="text-gray-300 hover:text-white">Admin Panel</a>
                <a href="{% url 'admin_logout' %}" class="text-red-400 hover:text-red-300">Admin Logout</a>
            </div>
            {% elif user.is_authenticated %}
            <div class="relative">
                <div id="user-icon"
                    class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center text-white font-semibold cursor-pointer hover:bg-red-700 transition duration-300">
                    {{ user.username|first|upper }}
                </div>

                <!-- Dropdown Menu -->
                <div id="dropdown-menu"
                    class="absolute right-0 mt-2 w-48 bg-black bg-opacity-80 rounded-lg shadow-lg hidden">
                    <a href="{% url 'profile' %}"
                        class="block px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-red-400 transition duration-300">
                        Profile
                    </a>
                    <a href="{% url 'logout' %}"
                        class="block px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-red-400 transition duration-300">
                        Logout
                    </a>
                </div>
            </div>
            {% else %}
            <div class="ml-6">
                <a href="{% url 'login' %}" class="text-white font-bold hover:text-red-500 transition">Login</a>
                <span class="text-gray-500 mx-2">|</span>
                <a href="{% url 'register' %}" class="text-white font-bold hover:text-red-500 transition">Register</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>

<!-- JavaScript -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("search-input");
        const resultsDiv = document.getElementById("search-results");
        const userIcon = document.getElementById("user-icon");
        const dropdownMenu = document.getElementById("dropdown-menu");

        // Live Search
        searchInput.addEventListener("input", function () {
            let query = searchInput.value.trim();

            if (query.length > 1) {
                fetch(`/search/?q=${query}`)
                    .then(response => response.json())
                    .then(data => {
                        resultsDiv.innerHTML = "";
                        if (data.results.length > 0) {
                            data.results.forEach(movie => {
                                let movieItem = document.createElement("a");
                                movieItem.href = `/movie/${movie.id}/`;
                                movieItem.className =
                                    "block px-4 py-2 hover:bg-gray-700 transition duration-300 flex items-center";
                                movieItem.innerHTML = `
                                    <img src="${movie.poster_url}" class="w-10 h-14 mr-3 rounded" alt="${movie.title}">
                                    <div class="font-bold">${movie.title} (${movie.year})</div>
                                `;
                                resultsDiv.appendChild(movieItem);
                            });
                            resultsDiv.classList.remove("hidden");
                        } else {
                            resultsDiv.classList.add("hidden");
                        }
                    });
            } else {
                resultsDiv.classList.add("hidden");
            }
        });

        // Hide search results when clicking outside
        document.addEventListener("click", function (event) {
            if (!searchInput.contains(event.target) && !resultsDiv.contains(event.target)) {
                resultsDiv.classList.add("hidden");
            }
        });

        // Toggle Dropdown Menu
        if (userIcon) {
            userIcon.addEventListener("click", function (event) {
                event.stopPropagation();
                dropdownMenu.classList.toggle("hidden");
            });
        }

        // Close dropdown when clicking outside
        document.addEventListener("click", function (event) {
            if (!userIcon.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.add("hidden");
            }
        });
    });
</script>
